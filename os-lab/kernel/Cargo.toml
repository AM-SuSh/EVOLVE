[package]
name = "kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Single progressive OS kernel for the teaching lab environment"

[features]
default = ["lab1"]
lab1 = ["dep:os-sbi"]
lab2 = ["lab1", "dep:os-context", "dep:os-syscall"]
lab3 = ["lab2", "dep:os-alloc", "dep:os-vm"]
lab4 = ["lab3"]
lab5 = ["lab4", "dep:os-fs"]
lab6 = ["lab5", "dep:easy-fs", "dep:virtio-drivers", "dep:spin"]
lab7 = ["lab6", "dep:os-signal"]
lab8 = ["lab7", "dep:os-sync"]
# 教学边界：trace-edu 仅由平台受信 recipe 显式启用。Lab2 记录 trap/调度，
# Lab3+ 继续记录地址空间与系统调用事件，供服务端断言和证据完整性校验。
trace-edu = []

[dependencies]
os-sbi = { path = "../os-sbi", optional = true }
os-context = { path = "../os-context", optional = true }
os-syscall = { path = "../os-syscall", optional = true }
os-alloc = { path = "../os-alloc", optional = true }
os-vm = { path = "../os-vm", optional = true }
os-fs = { path = "../os-fs", optional = true }
os-signal = { path = "../os-signal", optional = true }
os-sync = { path = "../os-sync", optional = true }
easy-fs = { package = "tg-rcore-tutorial-easy-fs", version = "0.4.8", optional = true }
virtio-drivers = { version = "0.1.0", optional = true }
spin = { version = "0.9", optional = true }

[build-dependencies]
easy-fs = { package = "tg-rcore-tutorial-easy-fs", version = "0.4.8" }
