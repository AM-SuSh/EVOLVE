[package]
name = "user"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "User-space test programs for the OS teaching lab"

[lib]
name = "user_lib"
crate-type = ["staticlib", "rlib"]

[dependencies]
os-syscall = { path = "../os-syscall" }

[[bin]]
name = "hello"
path = "src/bin/hello.rs"

[[bin]]
name = "power"
path = "src/bin/power.rs"

[[bin]]
name = "yield"
path = "src/bin/yield.rs"

[[bin]]
name = "fork_test"
path = "src/bin/fork_test.rs"

[[bin]]
name = "exec_test"
path = "src/bin/exec_test.rs"

[[bin]]
name = "fs_test"
path = "src/bin/fs_test.rs"

[[bin]]
name = "pipe_test"
path = "src/bin/pipe_test.rs"
