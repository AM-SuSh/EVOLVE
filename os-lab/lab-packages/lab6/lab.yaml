schema_version: 1
id: lab6
title: 磁盘文件系统
version: 1.0.0
feature: lab6
prerequisites: [lab1, lab2, lab3, lab4, lab5]
textbook: [OSTEP Ch.40 File System Implementation, OSTEP Ch.43 Log-structured File Systems]
status: stable
manual_revision: lab6-kernel-hard-link-v2.0
manual: ../../labs/lab6-disk-fs.md
answers: ../../labs/answers/lab6-answers.md
