# Lab6 debug 变体：link 漏掉 nlink += 1

id: lab6-debug-nlink
lab: lab6
variant: debug
version: 2.0.0

learning_goal: |
  学生按现象排查：DiskFs::link 已共享 FileMeta，但漏掉 nlink += 1，
  导致 link_test 失败。与 fill 考察同一知识点。

target_concepts:
  - os.fs.hard-link

student_file: kernel/src/fs/disk.rs
source_template: ../../../../scaffold/exercises/lab6/debug/kernel/src/fs/disk.rs
manual_anchor: labs/lab6-disk-fs.md

planted_bug:
  location: DiskFs::link 中 aliases.insert 之前
  wrong: 只 insert 别名，注释掉了 nlink += 1
  correct: meta.lock().nlink += 1 后再 aliases.insert
  symptom: |
    file_test 仍可能通过；link_test 报 fstat nlink mismatch
    或缺少 Test link OK!。

success_criteria:
  recipe: lab6.verify.v1
  assertions: [file-pass, link-pass, all-processes-exited]

negative_tests:
  - id: missing-nlink-bump
    description: 未修复时 Test link OK! 缺失
    expect_fail_assertions: [link-pass]

common_mistakes:
  - 去改 user/src/bin/link_test.rs 的断言，忽略内核 DiskFs::link
  - 改成 alloc_meta(dst) 造新 inode，破坏共享 ino

hint_ladder:
  - level: 0
    when: 尚未复现
    say: 先记录有没有 file_test pass 与 Test link OK!，二者是否同时失败。
  - level: 1
    when: 已确认只有硬链接测例失败
    say: sys_linkat 最终进了哪个内核函数？共享 meta 之后还缺什么？
  - level: 2
    when: 已打开 DiskFs::link
    say: 对照注释中的 PLANTED BUG；补上 nlink += 1 后必须看到 Test link OK!。
  - level: 3
    when: 仍失败
    say: 确认 bump 发生在 aliases.insert 之前或之后均可，但必须对同一份 meta 加锁。

report_prompts:
  - 你的第一个假设是什么？哪条输出否定了它？
  - fill（补全 attach）与 debug（漏 bump nlink）考察的是同一点的哪两个侧面？
