# lab6 fill 变体：硬链接挂别名并 bump nlink

id: lab6-fill
lab: lab6
variant: fill
version: 2.0.0

learning_goal: |
  学生补全 DiskFs::link 路径上的 attach_hard_link_alias：
  共享同一 FileMeta，并把 nlink +1。

target_concepts:
  - os.fs.hard-link

student_file: kernel/src/fs/disk.rs
source_template: ../../../../scaffold/exercises/lab6/fill/kernel/src/fs/disk.rs
manual_anchor: labs/lab6-disk-fs.md

what_is_blank:
  - symbol: attach_hard_link_alias
    hint_in_source: true

success_criteria:
  recipe: lab6.verify.v1
  assertions: [file-pass, link-pass, all-processes-exited]

negative_tests:
  - id: leave-todo
    description: 未实现（仍 todo!）则看不到 Test link OK!
    expect_fail_assertions: [link-pass]

hint_ladder:
  - level: 0
    when: 尚未描述要补什么
    say: 先说清硬链接要共享什么、nlink 在 linkat 后应如何变化。
  - level: 1
    when: 方向正确但仍卡住
    say: 对照 DiskFs::link：源 meta 已就绪后，应对 dst 做哪三步？
  - level: 2
    when: 能编译但 link_test 失败
    say: 核对 nlink += 1、aliases.insert、hidden.remove；不要 alloc_meta(dst)。

report_prompts:
  - fork/link 后为何必须共享 FileMeta 并 bump nlink？用 Test link OK! 证明。
  - 若只 insert 不加 nlink，用户 fstat 会看到什么？
