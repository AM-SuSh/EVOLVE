id: os.thread.blocking
title: 线程状态与阻塞唤醒
level: mechanism
summary: 同进程线程共享地址空间与资源，但各自拥有 tid、栈和调度状态；阻塞时移出就绪队列，条件满足后重新入队。
source_anchors: [kernel/src/processor.rs, kernel/src/sync_syscall.rs]
invariants: [Blocked 线程不可被普通调度选中, 唤醒必须恢复为可调度状态]
observable_evidence: [threads_test pass, threads_arg_test pass]
---
id: os.sync.mutex
title: 阻塞互斥与调度衔接
level: mechanism
summary: 拿不到锁返回 -1，由 finish_blocking_syscall 回退 sepc 并 Blocked；unlock 须 mark_mutex_handoff 且 re_enque，用户态 while 重试。
source_anchors: [kernel/src/sync_syscall.rs, os-sync/src/mutex.rs, kernel/src/trap.rs]
invariants: [同一时刻最多一个持有者, -1 可重试而 -0xDEAD 不可当阻塞, handoff 不能代替 re_enque]
observable_evidence: [mutex_test pass, condvar_test pass]
