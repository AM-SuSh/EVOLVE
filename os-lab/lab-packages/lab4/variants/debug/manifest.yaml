id: lab4-debug-wait-status
lab: lab4
variant: debug
version: 1.0.0
learning_goal: 区分 waitpid 返回的子进程 pid 与独立写回的 exit code，修复错误的通过条件。
target_concepts: [os.process.fork-wait]
student_file: user/src/bin/fork_test.rs
source_template: ../../../../scaffold/exercises/lab4/debug/user/src/bin/fork_test.rs
manual_anchor: labs/lab4-process.md#任务一跑通-lab4
planted_bug:
  location: fork_test 的父进程验收条件
  wrong: 把正常退出码 0 误判为必须等于 1
  correct: waited 等于 child pid 且 exit_code 等于 0
  symptom: 父子与 wait 输出存在，但缺少 fork_test pass
success_criteria:
  recipe: lab4.verify.v1
  assertions: [parent-output, child-output, fork-pass, all-processes-exited]
negative_tests:
  - id: wrong-exit-code-oracle
    expect_fail_assertions: [fork-pass]
    description: 未修复时可信运行不得出现 fork_test pass
hint_ladder:
  - { level: 0, when: 尚未运行, say: 先记录 waited pid 与 exit_code 的实际值。 }
  - { level: 1, when: 已看到父子输出, say: 对照 waitpid 返回值和第二个参数各自代表什么。 }
  - { level: 2, when: 仍混淆两个值, say: 子进程调用 exit(0)，哪个变量应该等于 0？ }
  - { level: 3, when: 已定位条件, say: 只修正验收条件，再用四条断言复验。 }
report_prompts:
  - 哪条输出证明 fork 本身成功而错误只在结果判定？
  - waited 与 exit_code 分别由谁产生？
