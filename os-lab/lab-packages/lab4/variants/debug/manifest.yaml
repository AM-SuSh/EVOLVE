# lab4 debug 变体：sys_fork 父子返回值埋错

id: lab4-debug-fork-return
lab: lab4
variant: debug
version: 1.1.0
learning_goal: 修复 sys_fork 的返回值错误：父进程必须返回子 PID，子进程 a0 才是 0；用运行证据区分父子分支。
target_concepts: [os.process.fork-wait]
student_file: kernel/src/process.rs
source_template: ../../../../scaffold/exercises/lab4/debug/kernel/src/process.rs
manual_anchor: labs/lab4-process.md#任务一跑通-lab4
planted_bug:
  location: sys_fork 的父进程返回值（非 lab8 分支末尾）
  wrong: 父进程也返回 0，父子都走进子分支
  correct: 父进程返回 child_pid；子进程 TrapContext.set_return_value(0)
  symptom: 只出现两次 I am child，缺 I am parent、waited pid done 与 fork_test pass
success_criteria:
  recipe: lab4.verify.v1
  assertions: [parent-output, child-output, fork-pass, all-processes-exited]
negative_tests:
  - id: fork-return-oracle
    expect_fail_assertions: [parent-output, fork-pass]
    description: 未修复时可信运行不得出现 I am parent / fork_test pass
  - id: both-child-only
    description: 只改子进程返回值而父进程仍返回 0，仍缺父输出
    expect_fail_assertions: [parent-output]
hint_ladder:
  - { level: 0, when: 尚未运行, say: 先复现并记录输出：I am child 出现了几次？父进程的 I am parent 为什么没有？ }
  - { level: 1, when: 已确认缺父输出, say: 提出假设：父进程拿到的 fork 返回值是几？谁负责给父进程写返回值？ }
  - { level: 2, when: 假设停在用户程序, say: fork_test.rs 没有改，问题应沿 sys_fork 查内核；父返回值与子 a0 各在哪一行？ }
  - { level: 3, when: 已定位 sys_fork, say: 对照「父得子 PID、子得 0」，修正返回值后用四条断言复验。 }
report_prompts:
  - 哪条输出证明是 sys_fork 返回值错误而不是用户分支写错？
  - 父进程返回值和子进程 a0 分别由谁写入？为什么二者不能相同？
