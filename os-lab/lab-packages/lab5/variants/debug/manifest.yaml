# Lab5 debug 变体：管道关错端

id: lab5-debug-pipe-ends
lab: lab5
variant: debug
version: 1.1.0

learning_goal: |
  学生按现象→假设排查：fork 后管道读/写端关闭顺序错误，导致子进程读不到数据。
  与 fill 变体考察同一知识点（pipe + fork 两端协议），形式为排错而非补全。

target_concepts:
  - os.ipc.pipe
  - os.fs.fd

student_file: user/src/bin/pipe_test.rs
source_template: ../../../../scaffold/exercises/lab5/debug/user/src/bin/pipe_test.rs
manual_anchor: labs/lab5-fs-and-sync.md

planted_bug:
  location: fork 后子进程的 close
  wrong: 子进程关闭了读端 fds[0]，却仍试图从 fds[0] 读取
  correct: 子进程应关闭写端 fds[1]，从读端 fds[0] 读取
  symptom: |
    看不到 pipe says hi / pipe_test pass，或子进程 read 持续失败；
    父进程侧 write 可能仍成功，容易误判「管道坏了」或「调度问题」。

success_criteria:
  recipe: lab5.verify.v1
  assertions: [file-content, fs-pass, pipe-pass, all-processes-exited]

negative_tests:
  - id: wrong-end-closed
    description: 未修复时 pipe_test pass 缺失
    expect_fail_assertions: [pipe-pass]

common_mistakes:
  - 去改 fs_test / 文件名，忽略管道端
  - 只改父进程，不核对子进程该关哪一端

hint_ladder:
  - level: 0
    when: 尚未复现
    say: 先记录有没有 pipe_test pass，以及父进程是否打印 pipe write failed。
  - level: 1
    when: 已确认管道测例失败
    say: fork 之后，读端进程通常应关掉哪一端？写端进程呢？
  - level: 2
    when: 假设停在「write 失败」
    say: 若父进程 write 成功但子进程仍无输出，更应检查子进程 close/read 用的 fd。
  - level: 3
    when: 已读到子进程 close
    say: 对照注释中的 PLANTED BUG；修复后必须看到 pipe says hi 与 pipe_test pass。

report_prompts:
  - 你的第一个假设是什么？哪条输出否定了它？
  - fill（补全协议）与 debug（关错端）考察的是同一点的哪两个侧面？
