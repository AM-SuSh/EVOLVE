id: lab5-debug-file-namespace
lab: lab5
variant: debug
version: 1.0.0
learning_goal: 用 open/read 的分层证据定位文件名查找失败，而不是把问题误归因于 fd 或管道。
target_concepts: [os.fs.fd]
student_file: user/src/bin/fs_test.rs
source_template: ../../../../scaffold/exercises/lab5/debug/user/src/bin/fs_test.rs
manual_anchor: labs/lab5-fs-and-sync.md#任务一跑通-lab5
planted_bug:
  location: fs_test 首次 open 的文件名
  wrong: 请求不存在的 missing_testfile
  correct: 请求镜像内已有的 testfile
  symptom: 输出 open testfile failed，后续 fs/pipe 断言缺失
success_criteria:
  recipe: lab5.verify.v1
  assertions: [file-content, fs-pass, pipe-pass, all-processes-exited]
negative_tests:
  - { id: missing-embedded-name, expect_fail_assertions: [file-content, fs-pass], description: 错误名字必须阻断文件内容与 fs_test pass }
hint_ladder:
  - { level: 0, when: 尚未运行, say: 先记录第一个失败输出，不要先改管道。 }
  - { level: 1, when: open 失败, say: 对照 embedded 文件表与 open 参数。 }
  - { level: 2, when: 怀疑 read, say: read 是否在 fd 小于 0 时执行？ }
  - { level: 3, when: 已定位名字, say: 修正唯一名字后跑完整文件与管道回归。 }
report_prompts: [哪条证据说明失败发生在命名层？, 为什么 pipe_test 缺失不能直接证明管道有 bug？]
