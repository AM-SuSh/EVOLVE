# Lab2 debug 变体：yield 被当成 exit

id: lab2-debug
lab: lab2
variant: debug
version: 0.2.0-draft

learning_goal: |
  学生按「现象→假设→最小实验→证据→结论」排查：yield 只打印 1 次 Yield round
  就提前 All user apps exited。定位到 mark_current_suspended 误把状态写成 Exited，
  修复为 Ready，并理解让出 ≠ 退出。

target_concepts:
  - os.sched.task-state
  - os.sched.round-robin
  - os.trap.syscall-abi

student_file: kernel/src/task.rs
source_template: ../../../scaffold/exercises/lab2/debug/kernel/src/task.rs
manual_anchor: labs/lab2-trap-and-task.md#任务四教师发放的变体若有

planted_bug:
  location: mark_current_suspended
  wrong: TaskStatus::Exited
  correct: TaskStatus::Ready
  symptom: |
    yield 程序本应 5 轮 Yield round，实际只出现 1 次后系统打印
    All user apps exited. 并关机。

success_criteria:
  recipe: test-lab2
  assertions: [hello-output, power-result, yield-five-rounds, all-exited]

negative_tests:
  - id: unfixed-exited-on-yield
    description: 未修复时 Yield round 计数 < 5，却可能进程退出码仍为 0
    expect_fail_assertions: [yield-five-rounds]
    anti_pattern: 禁止仅用「退出码 0」判定 Lab 通过
  - id: change-exit-path-only
    description: 只改 exit 路径、不改 suspended → 仍失败
    expect_fail_assertions: [yield-five-rounds]
  - id: force-single-task
    description: 删掉其他 app 伪装「通过」→ 仍缺少多任务切换证据
    expect_fail_assertions: [power-result]
    note: 教师/自动评分应检查多程序输出集合

common_mistakes:
  - 以为是 trap.asm 双栈问题（应用最小实验区分）
  - 修成 UnInit 或其他非法状态
  - 报告只写「改好了」无假设与证据链

hint_ladder:
  - level: 0
    when: 尚未复现
    say: 先完整跑一次 lab2，亲手数 Yield round 出现了几次，再下结论。
  - level: 1
    when: 已确认只有 1 次
    say: 提出一个假设：主动让出的任务为什么没被再次调度？让出和退出在状态上应有何不同？
  - level: 2
    when: 假设停留在「trap 保存坏了」
    say: 设计最小实验区分：若 hello/power 正常，更像调度状态问题还是双栈问题？顺着 SYS_YIELD 往下读。
  - level: 3
    when: 已读到 suspended 仍未定位
    say: 对比「yield 路径」和「exit 路径」谁改了 task_status；修复后必须用 Yield round×≥5 证明，不能只看退出码。

report_prompts:
  - 你提出的第一个假设是什么？哪条证据否定了它？
  - 若没有 yield-five-rounds 断言，仅看退出码会如何误判？
