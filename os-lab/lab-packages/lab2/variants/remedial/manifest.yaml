# Lab2 补救变式：yield 概念加固（remedial）

id: lab2-remedial-yield
lab: lab2
variant: remedial
version: 0.2.0-boxed
# 0.2.0-boxed：Day5 装箱（PACKAGE.md + 教师验收）；正式班级发布前由 C 升 1.0.0

learning_goal: |
  面向「已接触 debug/fill 但仍混淆让出与退出」的学生。
  用更短的提示阶梯与强制对照表，在不大改代码面的前提下重建任务状态机心智，
  并以 Yield×≥5 作为唯一不可妥协证据。

target_concepts:
  - os.sched.task-state
  - os.sched.round-robin

student_file: kernel/src/task.rs
# 复用 debug 源作为起点（含典型 Exited 误用），修通即过关
source_template: ../../../scaffold/exercises/lab2/debug/kernel/src/task.rs
manual_anchor: labs/lab2-trap-and-task.md#任务一先完成教师下发的-filldebug-变体再跑通内核

remedial_extra:
  required_table: |
    学生须在报告中填写：
    | 动作 | 正确下一状态 | 错误下一状态 |
    | yield | Ready | Exited |
    | exit | Exited | Ready |
  max_hints_before_teacher: 3

success_criteria:
  recipe: lab2.verify-trace.v1
  assertions: [hello-output, power-result, yield-five-rounds, all-exited]

negative_tests:
  - id: still-exited-on-yield
    expect_fail_assertions: [yield-five-rounds]
    anti_pattern: 禁止仅用退出码 0

hint_ladder:
  - level: 0
    when: 未填对照表
    say: 先完成 yield/exit 状态对照表，再打开 task.rs。
  - level: 1
    when: 表已填但仍 1 次 Yield
    say: 沿着 SYS_YIELD 找到改 status 的函数，与 exit 路径逐行对比。
  - level: 2
    when: 已定位函数仍改错
    say: 只改一处状态赋值并重跑；用 Yield 行数证明，不要改测试程序。
  - level: 3
    when: 仍失败
    say: 暂停自主探索，携带对照表与最近一次输出截请求教师短辅导（H5）。

report_prompts:
  - 粘贴你的状态对照表。
  - 修复前后 Yield 行数各是多少？
