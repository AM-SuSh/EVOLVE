    stage: debug
    required_evidence: [run, code]
    prompt: 区分映射缺失、权限错误与 satp 未切换，并设计最小验证。
  - id: C3-5
    stage: reflect
    required_evidence: [report]
    prompt: 写清第一个假设、证伪证据和修复后的可信运行。
