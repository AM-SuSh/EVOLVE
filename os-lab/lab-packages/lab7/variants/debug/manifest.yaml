# Lab7 debug 变体：信号帧没有跳转到处理函数

id: lab7-debug-signal-frame
lab: lab7
variant: debug
version: 2.0.0

learning_goal: |
  学生按「现象 → 假设 → 最小实验 → 证据 → 结论」排查：signal_test / signal_mask_test
  一直等不到处理函数，定位到 `handle_pending` 构造信号帧时没有把 `sepc` 改到 handler。

target_concepts:
  - os.signal.delivery
  - os.signal.sigreturn-frame
  - os.trap.return

student_file: kernel/src/signal.rs
source_template: ../../../scaffold/exercises/lab7/debug/kernel/src/signal.rs
manual_anchor: labs/lab7-ipc-signal.md#任务一完成实验

planted_bug:
  location: kernel/src/signal.rs handle_pending 的信号帧构造
  wrong: 保存了 saved_trap_cx、写了 a0，但没有把 cx.sepc 改为 handler
  correct: cx.sepc = handler
  symptom: |
    signal_test 输出 signal_child timeout / signal child exit bad；
    signal_mask_test 输出 signal_mask_test timeout；缺 signal_test pass。

success_criteria:
  recipe: lab7.verify.v1
  assertions: [dup-pass, signal-pass, signal-mask-pass, pipe-pass]

negative_tests:
  - id: unfixed-sepc
    description: 未修复时 signal-pass / signal-mask-pass 失败
    expect_fail_assertions: [signal-pass, signal-mask-pass]
  - id: fix-a0-only
    description: 只改 a0 不改 sepc → 仍超时
    expect_fail_assertions: [signal-pass]
  - id: remove-save-context
    description: 把 saved_trap_cx 也去掉 → sigreturn 失败，handler 返回后异常
    expect_fail: true

common_mistakes:
  - 以为问题在 trap.rs 的 yield 路径，没有先区分 pending 与 delivery
  - 只修 a0 / 只修 saved_trap_cx，忘记 sepc
  - 报告只写「改好了」无假设与证据链

hint_ladder:
  - level: 0
    when: 尚未复现
    say: 先完整跑一次 make test-lab7，确认 signal_test 停在哪个输出。
  - level: 1
    when: 已确认 signal_child timeout
    say: 子进程在循环 yield 等信号：pending 是否被清掉？handler 是否真的执行过？
  - level: 2
    when: 假设停留在「kill 没生效」
    say: 设计最小对照：在 handle_pending 里打印取到的 signum 与 handler，确认走到了帧构造。
  - level: 3
    when: 已看到 handler 地址正确但没跳转
    say: 返回用户态时 CPU 按哪个寄存器决定下一条指令？sepc 应该指向哪里？

report_prompts:
  - 你的第一个假设是什么？哪条证据否定了它？
  - pending 被 take_deliverable 消费后，若帧构造失败，信号会怎样？
  - 修复后 signal_test 与 signal_mask_test 分别证明了什么？
