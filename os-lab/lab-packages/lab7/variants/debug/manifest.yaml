learning_goal: 区分信号 pending 与 delivery，修复未真正屏蔽 SIGUSR1 的掩码设置。
target_concepts: [os.signal.mask]
student_file: user/src/bin/signal_mask_test.rs
source_template: ../../../../scaffold/exercises/lab7/debug/user/src/bin/signal_mask_test.rs
