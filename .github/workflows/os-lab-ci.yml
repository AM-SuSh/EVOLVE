name: os-lab-ci

on:
  push:
    paths:
      - '.github/workflows/os-lab-ci.yml'
      - 'os-lab/**'
  pull_request:
    paths:
      - '.github/workflows/os-lab-ci.yml'
      - 'os-lab/**'

jobs:
  trusted-teaching-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: os-lab/handbook

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: os-lab/handbook/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: os-lab/learning/knowledge/requirements.txt

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv64gc-unknown-none-elf
          components: rust-src, llvm-tools-preview

      - name: Install Rust binary utilities
        run: |
          cargo install cargo-binutils --version 0.4.0 --locked
          rust-objcopy --version

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-misc

      - name: Install handbook dependencies
        run: npm ci

      - name: Install knowledge parser dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ../learning/knowledge/requirements.txt

      - name: Verify trusted teaching chain
        run: npm run test:day7
